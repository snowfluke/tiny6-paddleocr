name: pages

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - src/**
      - models/**
      - tools/build-wasm.ts
      - tools/build-web.ts
      - tools/share-memory.ts
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: bun install --frozen-lockfile
      # kernels.wasm, kernels.shared.wasm, demo/tiny6.js with both inlined
      - run: bun run build

      # The same staging tools/serve.ts does locally; demo/models is
      # gitignored so the models are copied in, 6 MB.
      - run: |
          mkdir -p demo/models
          cp models/det.onnx models/rec.onnx models/dict.txt demo/models/
          cp test/images/receipt.png demo/receipt.png
          ls -la demo demo/models

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
