name: deploy-demo

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - src/**
      - models/**
      - tools/build-wasm.ts
      - tools/build-web.ts
      - tools/share-memory.ts
      - tools/stage-demo.ts
      - wrangler.jsonc
      - .github/workflows/deploy-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: bun install --frozen-lockfile
      # kernels.wasm, kernels.shared.wasm, demo/tiny6.js with both inlined
      - run: bun run build
      # demo/models and demo/receipt.png, gitignored
      - run: bun tools/stage-demo.ts

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
