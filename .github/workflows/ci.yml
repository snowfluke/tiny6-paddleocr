name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86 Linux rebuilds the kernels with the pinned toolchain and
          # checks the committed binaries did not drift. The other legs run
          # the committed kernels: Linux ARM and macOS take the sdot (int8)
          # path, Windows and x86 Linux the fp32 fallback.
          - os: ubuntu-latest
            rust: true
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Version and target come from rust-toolchain.toml.
      - if: matrix.rust
        run: rustup toolchain install

      - run: bun install --frozen-lockfile
      - if: matrix.rust
        run: bun run build
      - if: matrix.rust
        run: git diff --exit-code --stat -- src/wasm/kernels.wasm src/wasm/kernels.shared.wasm
      - run: bun run typecheck

      # The goldens are ~100 MB of ORT output and are not committed, so the
      # first test run regenerates them. Cached by model file hash and runner.
      - uses: actions/cache@v4
        with:
          path: test/golden
          key: goldens-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('models/*.onnx') }}

      - run: bun test
      - run: bun run check
